services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://careerpath:careerpath@db:5432/careerpath
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - .:/app
    command: >
      sh -c "uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build: .
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      - api
    volumes:
      - .:/app
    command: >
      streamlit run apps/ui.py --server.port 8501 --server.address 0.0.0.0

  db:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: careerpath
      POSTGRES_PASSWORD: careerpath
      POSTGRES_DB: careerpath
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
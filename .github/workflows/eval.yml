name: LLM Eval Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  eval:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: careerpath
          POSTGRES_PASSWORD: careerpath
          POSTGRES_DB: careerpath
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careerpath -d careerpath"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://careerpath:careerpath@localhost:5432/careerpath
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize database
        run: |
          pip install asyncpg sqlalchemy[asyncio] pgvector
          python -c "
import asyncio
from apps.api.db.session import init_db
asyncio.run(init_db())
          "

      - name: Run LLM eval pipeline
        run: |
          python evals/run_eval.py